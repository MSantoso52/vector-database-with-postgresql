services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    container_name: vector_db
    environment:
      POSTGRES_USER: pgvector
      POSTGRES_PASSWORD: pgvectorpasswd
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
